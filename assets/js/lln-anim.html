<script>
/*
  The law of large numbers — slide #lln, after 3Blue1Brown.
  Left: a card with a fair die's six faces and μ = 3.5, then three
  number lines from 1 to 6. Each dot is ONE person's average of n throws:
  n = 5, then 25, then 100, fifteen people per line. Right: that person's
  actual throw, n dice and X̄ₙ = their average, then the dot drops in.
    0. the card, one empty line, and the first throw of five dice; then the
       other fourteen people, faster (wide scatter)
    1. the n = 25 line (tighter)
    2. the n = 100 line (tighter still)
    3. the grid gives way: labels X̄₅, X̄₂₅, X̄₁₀₀, a vertical ellipsis, and
       a last empty line marked only at μ — where every average ends up
  All averages are real, from a seeded generator, the same each time.

  Built on StageKit (assets/js/stage-kit.html). Canvas 1000x445.
*/
(function () {
  var K = window.StageKit, PAL = K.PAL;

  var W = 1000, H = 445;
  // a fair die here, so μ = 3.5 sits in the middle of the 1–6 line
  var P = [1, 1, 1, 1, 1, 1].map(function () { return 1 / 6; });
  var MU = P.reduce(function (a, p, i) { return a + p * (i + 1); }, 0);
  var NS = [5, 25, 100], PEOPLE = 15;
  var COLS = [PAL.olive, PAL.orange, PAL.navy];

  var LX0 = 60, LX1 = 480;                         // number lines: 1.0 .. 6.0
  function lx(v) { return LX0 + (v - 1) / 5 * (LX1 - LX0); }
  var LY = [176, 248, 320];                        // the three lines
  var GX = 620, GY = 20, GS = 30;                  // the dice grid

  var ROMAN = "MathJax_Main, 'Times New Roman', serif", ITAL = "MathJax_Math, 'Times New Roman', serif";
  function math(g, x, y, runs, size, fill) {
    var t = g.appendChild(K.el('text', { x: x, y: y, 'font-size': size || 22, 'font-family': ROMAN, fill: fill || PAL.ink }));
    runs.forEach(function (r) {
      var sp = t.appendChild(K.el('tspan', { 'font-family': r[1] === 'i' ? ITAL : null, 'font-style': r[1] === 'i' ? 'italic' : null,
        fill: r[2] || null, 'baseline-shift': r[3] || null, 'font-size': r[3] ? '65%' : null }));
      sp.textContent = r[0];
    });
    return t;
  }
  function show(node, on, instant, ms) {
    node.style.transition = instant ? 'none' : 'opacity ' + (ms || 450) + 'ms ease';
    node.style.opacity = on ? 1 : 0;
  }

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var CUM = P.reduce(function (a, p, i) { a.push((a[i - 1] || 0) + p); return a; }, []);
  var R = rng(31337);
  function face() { var u = R(), f = 0; while (f < 5 && u > CUM[f]) f++; return f + 1; }
  // every person's actual throws, kept so the dice on screen ARE the dot
  var THROWS = NS.map(function (n) {
    var out = [];
    for (var k = 0; k < PEOPLE; k++) { var t = []; for (var j = 0; j < n; j++) t.push(face()); out.push(t); }
    return out;
  });
  var AVG = THROWS.map(function (row) { return row.map(function (t) { return t.reduce(function (a, b) { return a + b; }, 0) / t.length; }); });

  function axis(g, y) {
    g.appendChild(K.el('line', { x1: lx(1), y1: y, x2: lx(6), y2: y, stroke: PAL.inkSoft, 'stroke-width': 1.8 }));
    [1, 6].forEach(function (v) {
      g.appendChild(K.el('line', { x1: lx(v), y1: y - 8, x2: lx(v), y2: y + 8, stroke: PAL.inkSoft, 'stroke-width': 1.8 }));
      math(g, lx(v), y + 30, [[v.toFixed(1)]], 20).setAttribute('text-anchor', 'middle');
    });
    g.appendChild(K.el('line', { x1: lx(MU), y1: y - 6, x2: lx(MU), y2: y + 6, stroke: PAL.brick, 'stroke-width': 2 }));
    math(g, lx(MU), y + 30, [[MU.toFixed(1), null, PAL.brick]], 20).setAttribute('text-anchor', 'middle');
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H), i;

    // the card: six faces and μ
    svg.appendChild(K.el('rect', { x: 90, y: 4, width: 360, height: 112, rx: 16, fill: '#FAFBFC', stroke: PAL.rule, 'stroke-width': 2 }));
    for (i = 0; i < 6; i++) K.die(svg, 128 + i * 57, 42, 36, i + 1);
    math(svg, 270, 102, [['μ', 'i', PAL.brick], ['  =  ' + MU.toFixed(1)]], 26).setAttribute('text-anchor', 'middle');

    // the lines and their dots
    var lines = [], dots = [];
    NS.forEach(function (n, k) {
      var g = svg.appendChild(K.el('g', {}));
      axis(g, LY[k]);
      lines.push(g);
      dots.push(AVG[k].map(function (a) {
        return g.appendChild(K.el('circle', { cx: lx(a), cy: LY[k], r: 7, fill: COLS[k], 'fill-opacity': 0.85, opacity: 0 }));
      }));
    });

    // one panel per n: that person's n dice, and their average under them
    var panels = NS.map(function (n, k) {
      // every panel spans the same width PWD: columns share it, dice fill 85% of a cell
      var g = svg.appendChild(K.el('g', {})), cols = n === 25 ? 5 : Math.min(n, 10), rows = Math.ceil(n / cols);
      var PWD = 300, step = PWD / cols, size = step * 0.85;
      var x0 = GX + 150 - PWD / 2 + step / 2, y0 = GY + (n === 5 ? 110 : 10) + size / 2;
      var dice = [];
      for (var j = 0; j < n; j++) dice.push(K.die(g, x0 + (j % cols) * step, y0 + Math.floor(j / cols) * step, size, 1));
      dice.forEach(function (d) { if (d.g.firstChild) d.g.firstChild.setAttribute('fill', COLS[k]); });   // the die's body is its first child
      var ry = y0 + (rows - 1) * step + size / 2 + 44;
      var read = math(g, GX + 150, ry, [['X̄', 'i'], [String(n), null, null, 'sub'], ['  =  ']], 30);
      read.setAttribute('text-anchor', 'middle');
      var val = read.appendChild(K.el('tspan', { fill: COLS[k] }));
      return { g: g, dice: dice, val: val };
    });

    // the ending: labels, the ellipsis, and the limiting line
    var end = svg.appendChild(K.el('g', {}));
    NS.forEach(function (n, k) {
      math(end, LX1 + 30, LY[k] + 8, [['X̄', 'i', COLS[k]], [String(n), null, COLS[k], 'sub']], 28);
    });
    var lim = svg.appendChild(K.el('g', {}));
    var LYL = 425;
    [0, 1, 2].forEach(function (j) { lim.appendChild(K.el('circle', { cx: lx(MU), cy: 370 + j * 10, r: 2, fill: PAL.inkSoft })); });
    lim.appendChild(K.el('line', { x1: lx(1), y1: LYL, x2: lx(6), y2: LYL, stroke: PAL.inkSoft, 'stroke-width': 1.8 }));
    [1, 6].forEach(function (v) { lim.appendChild(K.el('line', { x1: lx(v), y1: LYL - 8, x2: lx(v), y2: LYL + 8, stroke: PAL.inkSoft, 'stroke-width': 1.8 })); });
    lim.appendChild(K.el('circle', { cx: lx(MU), cy: LYL, r: 8, fill: PAL.brick }));
    math(lim, LX1 + 30, LYL + 8, [['X̄', 'i', PAL.brick], ['n', 'i', PAL.brick, 'sub'], ['  →  '], ['μ', 'i', PAL.brick]], 28);
    // the law, top right: a heading, a justified paragraph, the limit
    var law = svg.appendChild(K.el('g', {}));
    var TX = 620, PW = 345, SANS = 'Roboto, sans-serif';
    law.appendChild(K.txt(TX, 26, 'The law of large numbers', { size: 25, fill: 'navy', weight: 700 }));
    function word(runs) {
      var t = law.appendChild(K.el('text', { x: 0, y: -200, 'font-size': 18, 'font-family': SANS, fill: PAL.ink }));
      runs.forEach(function (r) {
        var m = r[1] === 'm', sp = t.appendChild(K.el('tspan', { 'font-family': m ? ITAL : null, 'font-style': m ? 'italic' : null,
          'font-size': m ? 20 : null, fill: r[2] || null }));
        sp.textContent = r[0];
      });
      return t;
    }
    var Tw = function (t) { return [[t]]; }, Mw = function (t, c) { return [[t, 'm', c]]; };
    var words = [Tw('As'), Mw('n'), Tw('grows,'), Tw('the'), Tw('average'), Tw('of'), Mw('n'), Tw('throws'), Tw('stays'),
      Tw('centred'), Tw('on'), [['μ', 'm', PAL.brick], [',']], Tw('but'), Tw('its'), Tw('variance'), Tw('is'), [['σ²/n', 'm', PAL.orange], [',']],
      Tw('so'), Tw('its'), Tw('standard'), Tw('deviation'), [['σ/√n', 'm', PAL.orange]], Tw('shrinks:'),
      [['0.76', null, PAL.olive], [',']], [['0.34', null, PAL.orange], [',']], [['0.17', null, PAL.navy]], Tw('for'), Mw('n'), Tw('='),
      Tw('5,'), Tw('25,'), Tw('100.'), Tw('The'), Tw('spread'), Tw('vanishes'), Tw('and'), Tw('the'), Tw('average'), Tw('settles'), Tw('on'), [['μ', 'm', PAL.brick], [':']]];
    var pa = word([['a a']]), pb = word([['aa']]), space = (pa.getComputedTextLength() - pb.getComputedTextLength()) || 5;
    law.removeChild(pa); law.removeChild(pb);
    var nodes = words.map(word), wide = nodes.map(function (t) { return t.getComputedTextLength() || 9 * t.textContent.length; });
    var plines = [], cur = [], used = 0;   // not `lines`: that name holds the number lines
    wide.forEach(function (w, k) {
      if (cur.length && used + space + w > PW) { plines.push(cur); cur = []; used = 0; }
      used += (cur.length ? space : 0) + w; cur.push(k);
    });
    plines.push(cur);
    plines.forEach(function (ln, row) {
      var sum = ln.reduce(function (a2, k) { return a2 + wide[k]; }, 0);
      var gap = row < plines.length - 1 && ln.length > 1 ? (PW - sum) / (ln.length - 1) : space, x = TX;
      ln.forEach(function (k) { nodes[k].setAttribute('x', x.toFixed(1)); nodes[k].setAttribute('y', 60 + row * 26); x += wide[k] + gap; });
    });
    // centred under the paragraph
    math(law, TX + PW / 2, 60 + plines.length * 26 + 34, [['X̄', 'i'], ['n', 'i', null, 'sub'], ['  →  '], ['μ', 'i', PAL.brick], ['  =  3.5', null, PAL.brick], ['     as  '], ['n', 'i'], [' → ∞']], 30).setAttribute('text-anchor', 'middle');

    return { lines: lines, dots: dots, panels: panels, end: end, lim: lim, law: law, timers: [], state: 0 };
  }

  function stop(s) { s.timers.forEach(clearTimeout); s.timers = []; }

  function setDots(s, k, upto) {
    s.dots[k].forEach(function (d, j) { d.setAttribute('opacity', j < upto ? 1 : 0); });
  }

  // show person j of row k on the right: their dice and their average
  function person(s, k, j) {
    var pn = s.panels[k];
    pn.dice.forEach(function (d, i) { K.dieFace(d, THROWS[k][j][i]); });
    pn.val.textContent = AVG[k][j].toFixed(2);
  }
  // one person at a time: throw, read the average, drop the dot. The first
  // throw lingers so the room can read it; the rest speed up.
  function fill(s, k, delay) {
    setDots(s, k, 0);
    var t = delay;
    for (var j = 0; j < PEOPLE; j++) {
      (function (j, at) {
        s.timers.push(setTimeout(function () { person(s, k, j); }, at));
        s.timers.push(setTimeout(function () { setDots(s, k, j + 1); }, at + (j === 0 ? 1200 : 220)));
      })(j, t);
      t += j === 0 ? 2000 : 380;
    }
  }

  function place(s, i, instant) {
    stop(s);
    s.lines.forEach(function (g, k) { show(g, k <= i || i === 3, instant); });
    s.panels.forEach(function (pn, k) { show(pn.g, k === i, instant); });
    show(s.end, i === 3, instant); show(s.lim, i === 3, instant); show(s.law, i === 3, instant);
    var anim = !K.REDUCE && K.animeReady() && i < 3 && (instant ? i === 0 : i === s.state + 1);
    s.state = i;
    for (var k = 0; k < 3; k++) {
      if (k < i || i === 3) setDots(s, k, PEOPLE);
      else if (k > i) setDots(s, k, 0);
    }
    if (i < 3) {
      if (anim) fill(s, i, instant ? 500 : 0);
      else { setDots(s, i, PEOPLE); person(s, i, PEOPLE - 1); }
    }
  }

  K.register({
    stage: 'lln-stage',
    frags: ['lln-frag-1', 'lln-frag-2', 'lln-frag-3'],
    build: build,
    place: place,
    stop: stop
  });
})();
</script>
