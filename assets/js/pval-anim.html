<script>
/*
  p-value animation — slide #pval-intuition (deck Seminar 6, beamer
  Seminar 5, Exercise 3(b): z = 2, right-tailed).

  Teaching point: the p-value is not a verdict, it is an AREA. We build the
  null distribution by brute force and then read the tail off the picture:
    0. an empty axis                    (what would H0 produce?)
    1. 200 simulated z's rain into bins (that is the null distribution)
    2. the observed z = 2.0 drops on it (what our sample actually gave)
    3. everything at least that extreme lights up  (that share IS the p-value)

  The 200 draws come from a seeded LCG + Box-Muller rather than Math.random,
  so the histogram is pixel-identical in every run of the lecture. The number
  printed in state 3 is counted off the dots on screen, not quoted from a
  table — with this seed 5 of the 200 land beyond z = 2, so p = 0.025 (the
  theoretical value is 0.023, printed under it from Phi; the gap is the
  point of a simulation).

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x445, shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  var N = 200, ZOBS = 2.0, BINW = 0.4;
  var NAVY = K.PAL.navy, BRICK = K.PAL.brick;

  // Stage geometry — 1000x445 canvas, shown at scale(1.05).
  var W = 1000, H = 445, X0 = 80, X1 = 940, ZMIN = -4, ZMAX = 4;
  var BASE = 356, TOP = 67;            // baseline, and the ceiling of the tail
  var SIDE = 9, STEP = 9.5;            // dot size, and stack pitch
  var DOT_OP = 0.5, SHADE_OP = 0.1, SKY = -30;   // SKY = where dots wait
  // Each draw is a brick as wide as its bin (less a 4px gap), so the stacks
  // read as histogram bars rather than thin spikes.
  var BRICKW = BINW * (X1 - X0) / (ZMAX - ZMIN) - 4;

  // Phi by Abramowitz and Stegun 7.1.26 (good to 1.5e-7), as on #normal-area.
  function Phi(z) {
    var x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
    var e = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return 0.5 * (1 + (z < 0 ? -e : e));
  }

  function px(z) { return X0 + (z - ZMIN) * (X1 - X0) / (ZMAX - ZMIN); }

  // Seeded LCG (glibc constants, kept exact with imul + a 31-bit mask so the
  // multiply cannot drift past 2^53) fed through Box-Muller.
  function nulls(seed, n) {
    function u() {
      seed = (Math.imul(seed, 1103515245) + 12345) & 0x7fffffff;
      return (seed + 1) / 2147483649;          // strictly inside (0, 1)
    }
    var z = [];
    while (z.length < n) {
      var a = u(), b = u(), r = Math.sqrt(-2 * Math.log(a));
      z.push(r * Math.cos(2 * Math.PI * b));
      if (z.length < n) z.push(r * Math.sin(2 * Math.PI * b));
    }
    return z;
  }
  var DRAWS = nulls(864, N);

  // Stack each draw in its bin, in arrival order — so the rain reads as a
  // simulation piling up rather than a histogram assembling itself.
  function layout() {
    var counts = {};
    return DRAWS.map(function (v) {
      var b = Math.floor((v - ZMIN) / BINW);
      var j = counts[b] || 0;
      counts[b] = j + 1;
      var centre = ZMIN + b * BINW + BINW / 2;
      return { x: px(centre) - BRICKW / 2, y: BASE - SIDE - j * STEP };
    });
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);

    // --- shaded tail: behind the dots, so the dots stay legible ---
    var shade = svg.appendChild(K.el('rect', {
      x: px(ZOBS), y: TOP, width: X1 - px(ZOBS), height: BASE - TOP,
      fill: BRICK, opacity: 0, class: 'pval-shade'
    }));

    // --- axis ---
    svg.appendChild(K.el('line', {
      x1: X0, y1: BASE, x2: X1, y2: BASE, stroke: K.PAL.rule, 'stroke-width': 1
    }));
    [-3, -2, -1, 0, 1, 2, 3].forEach(function (z) {
      svg.appendChild(K.el('line', {
        x1: px(z), y1: BASE, x2: px(z), y2: BASE + 6,
        stroke: K.PAL.dim, 'stroke-width': 1
      }));
      svg.appendChild(K.txt(px(z), BASE + 25, z,
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    });

    var cap = K.txt(40, 28, '', { size: 'caption', cls: 'pval-caption' });
    svg.appendChild(cap);

    // --- the 200 draws, parked above the stage until they are called for ---
    var pts = layout(), tail = [], rest = [];
    var dots = DRAWS.map(function (v, i) {
      rest.push(pts[i].y);
      var d = svg.appendChild(K.el('rect', {
        x: pts[i].x, y: SKY, width: BRICKW, height: SIDE, rx: 1.5,
        fill: NAVY, opacity: 0, class: 'pval-dot'
      }));
      if (v > ZOBS) tail.push(d);
      return d;
    });

    // --- observed statistic: drawn over the dots ---
    var obs = K.el('g', { class: 'pval-obs', opacity: 0 });
    obs.appendChild(K.el('line', {
      x1: px(ZOBS), y1: TOP, x2: px(ZOBS), y2: BASE,
      stroke: BRICK, 'stroke-width': 2.5
    }));
    obs.appendChild(K.txt(px(ZOBS), TOP - 12, 'Observed z = ' + ZOBS.toFixed(1),
      { size: 'label', fill: 'brick', weight: 700, anchor: 'middle' }));
    svg.appendChild(obs);

    // --- the verdict, right-aligned over the shaded tail so it clears both
    //     the observed-z label above it and the vertical line to its left.
    //     The single-line "p = 5/200 = 0.025" at 30px spanned x 647-950 at
    //     anchor 950 and crossed the observed-z line at 725, so the readout
    //     is split into two lines. Right-anchored at 960 still left the
    //     caption line's left edge only ~10 units clear of the observed-z
    //     line at 725, so the block is anchored at 970 instead. ---
    // Left-aligned on one edge, 20 units right of the observed-z line.
    var RX = px(ZOBS) + 20;
    var res = K.el('g', { class: 'pval-res', opacity: 0 });
    var ratio = tail.length / N;
    // One family for the whole readout (the deck's sans): the result in bold
    // brick, the explanation and the table value in grey under it.
    var count = K.txt(RX, 108, tail.length + ' of ' + N,
      { size: 24, fill: 'brick', weight: 700, anchor: 'start' });
    res.appendChild(count);
    var p = K.txt(RX, 138, 'p = ' + ratio.toFixed(3),
      { size: 24, fill: 'brick', weight: 700, anchor: 'start' });
    res.appendChild(p);
    // Let the browser wrap and justify the annotation within the tail column.
    var explanation = K.el('foreignObject', { x: RX, y: 160, width: X1 - RX - 20, height: 88 });
    var paragraph = document.createElementNS('http://www.w3.org/1999/xhtml', 'p');
    paragraph.setAttribute('style', 'margin: 0; padding: 0; font: 18px/24px Roboto, sans-serif; color: ' + K.PAL.inkSoft + '; text-align: justify; text-align-last: left;');
    paragraph.textContent = 'Under H₀, the chance of seeing a z at least this large.';
    explanation.appendChild(paragraph);
    res.appendChild(explanation);
    res.appendChild(K.txt(RX, 268, // Short, so it stays right of the observed-z rule.
      'N(0, 1) table: ' + (1 - Phi(ZOBS)).toFixed(4),
      { size: 'label', fill: 'inkSoft', anchor: 'start' }));
    // The N(0, 1) curve the bricks are piling towards, in the same units
    // (expected count per bin, stacked at STEP px a count), so the table value
    // has a visible source: the area under it right of z = 2.
    var cd = '';
    for (var k = 0; k <= 160; k++) {
      var zz = ZMIN + k * (ZMAX - ZMIN) / 160;
      var y = BASE - N * BINW * Math.exp(-zz * zz / 2) / Math.sqrt(2 * Math.PI) * STEP;
      cd += (k ? 'L' : 'M') + px(zz).toFixed(1) + ' ' + y.toFixed(1);
    }
    res.appendChild(K.el('path', { d: cd, fill: 'none', stroke: K.PAL.ink, 'stroke-width': 2, 'stroke-dasharray': '6 5', opacity: 0.7 }));
    svg.appendChild(res);

    return { dots: dots, tail: tail, rest: rest, shade: shade,
             obs: obs, res: res, cap: cap, state: 0 };
  }

  var CAPTIONS = {
    0: 'If H₀ were true, what values of z would we see?',
    1: 'Each block represents a simulated z under H₀: ' + N + ' of them',
    2: 'Our sample gave z = ' + ZOBS.toFixed(1),
    3: 'p-value: probability of z at least this large under H₀'
  };

  // Each layer compares the state it is going to with the state it came from,
  // so a fragmenthidden reverses exactly the tween that showed it and a
  // no-op step (say 1 -> 2 for the dots) costs nothing.
  function rain(s, n, prev, A) {
    var down = n >= 1;
    if (!A) {
      s.dots.forEach(function (d, i) {
        d.setAttribute('y', down ? s.rest[i] : SKY);
        d.setAttribute('opacity', down ? DOT_OP : 0);
      });
      return;
    }
    if (down === (prev >= 1)) return;
    A.animate(s.dots, {
      y: function (t, i) { return down ? s.rest[i] : SKY; },
      opacity: down ? [0, DOT_OP] : 0,
      duration: 520,
      delay: A.stagger(6, down ? {} : { from: 'last' }),
      ease: down ? 'outQuad' : 'inQuad'
    });
  }

  function observed(s, n, prev, A) {
    var on = n >= 2;
    if (!A) {
      s.obs.setAttribute('opacity', on ? 1 : 0);
      s.obs.style.transform = on ? 'none' : 'translateY(-46px)';
      return;
    }
    if (on === (prev >= 2)) return;
    A.animate(s.obs, {
      opacity: on ? [0, 1] : 0,
      translateY: on ? [-46, 0] : -46,
      duration: 420,
      ease: on ? 'outQuad' : 'inQuad'
    });
  }

  function verdict(s, n, prev, A) {
    var on = n >= 3;
    var off = n >= 1 ? DOT_OP : 0;          // where a cooled dot goes back to
    if (!A) {
      s.shade.setAttribute('opacity', on ? SHADE_OP : 0);
      s.res.setAttribute('opacity', on ? 1 : 0);
      s.tail.forEach(function (d) {
        d.setAttribute('fill', on ? BRICK : NAVY);
        d.setAttribute('opacity', on ? 1 : off);
      });
      return;
    }
    if (on === (prev >= 3)) return;
    A.animate(s.shade, {
      opacity: on ? [0, SHADE_OP] : 0, duration: 420, ease: 'outQuad'
    });
    A.animate(s.tail, {
      fill: on ? BRICK : NAVY,
      opacity: on ? 1 : off,
      duration: 380,
      delay: A.stagger(70),
      ease: 'outQuad'
    });
    A.animate(s.res, {
      opacity: on ? [0, 1] : 0,
      duration: 380,
      delay: on ? 260 : 0,
      ease: 'outQuad'
    });
  }

  function place(s, n, instant) {
    var A = (instant || K.REDUCE || !K.animeReady()) ? null : window.anime;
    var prev = s.state;
    s.state = n;
    s.cap.textContent = CAPTIONS[n];
    rain(s, n, prev, A);           // verdict() runs last: it overrides the
    observed(s, n, prev, A);       // tail dots' colour set by rain()
    verdict(s, n, prev, A);
  }

  K.register({
    stage: 'pval-stage',
    frags: ['pval-frag-1', 'pval-frag-2', 'pval-frag-3'],
    build: build,
    place: place
  });
})();
</script>
