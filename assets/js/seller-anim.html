<script>
/*
  Three-sellers animation — slide #seller-intuition, the opener of Seminar 4.

  Three online sellers, all excellent on the face of it:
    A:  10 of 10   (100%)
    B:  48 of 50   (96%)
    C: 186 of 200  (93%)

  The slide is one gesture: put each percentage next to the reviews it was
  computed from. A percentage is lossy compression — it throws n away — and
  100 / 96 / 93 then ranks the sellers in exactly the wrong order. Drawn out,
  n comes back as AREA: ten marks is a fifth of a row, two hundred is four
  full ones. The ranking dissolves on sight, before any arithmetic. The
  crosses carry what the ticks cannot: A has none, which is not evidence of
  perfection but evidence of nobody having looked.

  Nothing is on screen at the start. The question is asked by the .lede-min
  above the stage, and each seller then arrives as its own three-part beat:

    the percentage   the claim, alone for a third of a second
    the marks        the evidence, filling left to right
    the count        the number that names what just filled

  in that order, because a percentage shown next to its sample size is a fact
  to be read, whereas a percentage shown and THEN undercut is an argument. The
  three fragments are the three sellers; the takeaway under the stage is a
  fourth, so the verdict cannot be read ahead of the evidence.

  The maths is not done here. #binom-intuition builds the machinery two slides
  on, and #seller-sim comes back and settles it in R. This slide only has to
  make the percentages stop being persuasive.

  The crosses are scattered through each block, not swept to the end: a run of
  ticks followed by a run of crosses reads as a sorted artefact rather than a
  review history. The scatter comes from a seeded shuffle so it is identical
  on every render — a presenter who points at "that cross there" finds it in
  the same place next year — and it plants what #binom-intuition picks up: a
  block in order is one SEQUENCE; the count throws the order away, and C(n,k)
  is how many sequences went with it.

  Built on StageKit (assets/js/stage-kit.html): palette, type roles and the
  Reveal fragment wiring live there. Canvas 1000x366 (the
  .stage-wrap-seller height), shown at scale(1.05).
*/
(function () {
  var K = window.StageKit;

  var SELLERS = [
    { k: 10,  n: 10  },
    { k: 48,  n: 50  },
    { k: 186, n: 200 }
  ];

  var S = SELLERS.map(function (sl, i) {
    return {
      k: sl.k, n: sl.n,
      pct: Math.round(100 * sl.k / sl.n) + '%',
      miss: K.missSet(sl.n, sl.n - sl.k, 7919 + i)  // distinct seed per seller
    };
  });

  // --- stage geometry — fixed 1000x300 space, scaled to the slide via CSS ---
  // Shorter than the deck's usual 445 because this slide carries a .lede-min
  // above the stage and a takeaway below it; at 445 the slide ran past the
  // 700px projection line.
  var W = 1000, H = 366;   // shared with #laplace-intuition

  // On StageKit's shared lattice (50 marks per row) A is a fifth of a row, B
  // is exactly one and C is four. Blocks are pre-positioned and never
  // reflowed, so nothing already on screen moves when the next seller
  // arrives — and #laplace-intuition draws them at these same coordinates.
  var GX = 47;
  // Headline baseline, then first row centre. The 24 units of extra air
  // between one seller and the next are what make three blocks read as three
  // separate claims rather than one striped field.
  var BLOCK = [
    { ly: 46,  ry: 74  },
    { ly: 142, ry: 170 },
    { ly: 238, ry: 266 }
  ];

  // Both sit on the block's own left edge (the first mark is centred at GX,
  // so its ink starts ~7px earlier), because a headline indented from the
  // evidence it labels reads as a caption rather than a claim.
  var PCT_X = GX - 7, CNT_X = 122;

  var INK = K.PAL.ink, GREY = K.PAL.dim;
  var HIT = K.PAL.olive, MISS = K.PAL.brick;

  // Everything on this stage starts hidden, so one helper does every element:
  // set the attribute AND clear any inline opacity anime left behind, or the
  // style would keep winning over the attribute on a later instant snap.
  function show(el, on) {
    el.setAttribute('opacity', on ? 1 : 0);
    el.style.opacity = '';
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);

    var lanes = S.map(function (a, idx) {
      var B = BLOCK[idx];

      var pct = svg.appendChild(K.txt(PCT_X, B.ly, a.pct,
        { size: 'readout', face: 'mono', fill: INK }));
      var count = svg.appendChild(K.txt(CNT_X, B.ly, a.n + ' reviews',
        { size: 'label', fill: GREY }));

      // Marks come back in reveal order so the arrival tween can light them
      // left to right, row by row, like reviews coming in.
      var g = svg.appendChild(K.el('g', { class: 'seller-block' }));
      var marks = K.block(g, a.n, a.miss, GX, B.ry);

      show(pct, false); show(count, false);
      return { pct: pct, count: count, marks: marks, on: false };
    });

    return { state: 0, lanes: lanes, anims: [] };
  }

  // Cancel everything still in flight before the next beat. A beat runs for
  // the best part of a second; a presenter arrowing back during it would
  // otherwise have the old tween keep writing opacities over a state that no
  // longer contains that seller.
  function stop(s) {
    s.anims.forEach(function (a) { if (a && a.pause) a.pause(); });
    s.anims = [];
  }

  function setMarks(ln, upto) {
    for (var i = 0; i < ln.marks.length; i++) {
      ln.marks[i].setAttribute('opacity', i < upto ? 1 : 0);
    }
  }

  // The static truth for a state, written on EVERY render before any tween
  // starts. Motion is the unreliable part: stop() pauses whatever is in
  // flight, a presenter clicking faster than the 620ms fill cancels the
  // previous lane part-way, and a backgrounded tab freezes the frame clock
  // outright. When the finished opacities are only ever written from inside a
  // tween, any of those leaves a seller half-drawn — or the whole stage
  // blank — with nothing to put it right. Writing them up front means the
  // tween only ever supplies the movement, never the result.
  function snap(s, st) {
    s.lanes.forEach(function (ln, idx) {
      var on = st >= idx + 1;
      show(ln.pct, on);
      show(ln.count, on);
      setMarks(ln, on ? ln.marks.length : 0);
      ln.on = on;
    });
  }

  // Fades by tweening a plain scalar and writing the ATTRIBUTE, rather than
  // letting anime set an inline style. snap() has to be able to overrule a
  // fade that was cancelled half-way, and an inline opacity would outrank the
  // attribute it writes.
  function fadeTo(s, el, on, dur, delay) {
    var p = { v: on ? 0 : 1 };
    el.setAttribute('opacity', p.v);
    s.anims.push(window.anime.animate(p, {
      v: on ? 1 : 0, duration: dur, delay: delay || 0, ease: 'outQuad',
      onUpdate: function () { el.setAttribute('opacity', p.v); }
    }));
  }

  function render(s, st, instant) {
    var was = s.lanes.map(function (ln) { return ln.on; });
    stop(s);
    s.state = st;
    snap(s, st);
    if (instant || K.REDUCE || !K.animeReady()) return;

    s.lanes.forEach(function (ln, idx) {
      var on = st >= idx + 1;
      if (on === was[idx]) return;          // this lane is not the one moving

      // Claim, evidence, name — and in reverse on the way out, fast, because
      // stepping back is navigation rather than narration.
      fadeTo(s, ln.pct, on, on ? 300 : 200, 0);

      // One tween drives the whole block rather than 200 staggered ones —
      // same effect, one object to cancel.
      var p = { u: on ? 0 : 1 };
      setMarks(ln, Math.round(p.u * ln.marks.length));
      s.anims.push(window.anime.animate(p, {
        u: on ? 1 : 0, duration: on ? 620 : 260, delay: on ? 250 : 0,
        ease: 'outQuad',
        onUpdate: function () {
          setMarks(ln, Math.round(p.u * ln.marks.length));
        }
      }));

      fadeTo(s, ln.count, on, on ? 300 : 200, on ? 820 : 0);
    });
  }

  K.register({
    stage: 'seller-stage',
    frags: ['seller-frag-1', 'seller-frag-2', 'seller-frag-3'],
    build: build,
    place: render,
    stop: stop
  });
})();
</script>
