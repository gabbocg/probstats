<script>
/*
  Student's t distribution — slide #tdist, in the style of #normal-build.
    0. σ known: (X̄ − μ)/(σ/√n) is N(0, 1)
    1. σ replaced by the sample's s: T = (X̄ − μ)/(s/√n). With n = 3
       (k = 2 degrees of freedom) the bell sinks and its tails fatten; the
       normal stays as a dashed ghost
    2. k sweeps 2 → 30: s gets close to σ and t closes in on N(0, 1)
    3. k = 4, tails beyond ±1.96 shaded: 12.2% of a t, against 5% of the
       normal, which is why small samples need the t table
  Each step morphs the curve point by point from the old one.

  Built on StageKit (assets/js/stage-kit.html). Canvas 1000x445.
*/
(function () {
  var K = window.StageKit, PAL = K.PAL;

  var W = 1000, H = 445;
  var X0 = 60, X1 = 940, XL = -5, XR = 5, YB = 410, PT = 165, YMAX = 0.4;   // the same plot box as #chisq
  function px(x) { return X0 + (x - XL) / (XR - XL) * (X1 - X0); }
  function py(y) { return YB - y / YMAX * (YB - PT); }
  var NPT = 240, XS = [];
  for (var i = 0; i <= NPT; i++) XS.push(XL + (XR - XL) * i / NPT);
  var CUT = 1.96;

  var LC = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  function lgamma(z) {
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
    z -= 1;
    var a = LC[0], t = z + 7.5;
    for (var j = 1; j < 9; j++) a += LC[j] / (z + j);
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(a);
  }
  // k = Infinity is the standard normal
  function dens(k) {
    if (!isFinite(k)) return function (x) { return Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); };
    var c = Math.exp(lgamma((k + 1) / 2) - lgamma(k / 2)) / Math.sqrt(k * Math.PI);
    return function (x) { return c * Math.pow(1 + x * x / k, -(k + 1) / 2); };
  }
  // P(|T| > CUT), Simpson on [CUT, CUT + 400]: the tail past that is < 1e-9 for k ≥ 2
  function tail(k) {
    var f = dens(k), n = 8000, h = 400 / n, a = f(CUT) + f(CUT + 400);
    for (var j = 1; j < n; j++) a += (j % 2 ? 4 : 2) * f(CUT + j * h);
    return 2 * a * h / 3;
  }

  var ROMAN = "MathJax_Main, 'Times New Roman', serif", ITAL = "MathJax_Math, 'Times New Roman', serif";
  function math(g, x, y, runs, size, anchor) {
    var t = g.appendChild(K.el('text', { x: x, y: y, 'font-size': size || 34, 'font-family': ROMAN, fill: PAL.ink, 'text-anchor': anchor || 'middle' }));
    runs.forEach(function (r) {
      var sp = t.appendChild(K.el('tspan', { 'font-family': r[1] ? ITAL : null, 'font-style': r[1] ? 'italic' : null, fill: r[2] || null }));
      sp.textContent = r[0];
    });
    return t;
  }

  function show(node, on, instant) {
    node.style.transition = instant ? 'none' : 'opacity 450ms ease';
    node.style.opacity = on ? 1 : 0;
  }
  function halo(t) { t.setAttribute('stroke', PAL.white); t.setAttribute('stroke-width', 6); t.setAttribute('paint-order', 'stroke'); return t; }

  var KS = [Infinity, 2, 30, 4];

  function build(stage) {
    var svg = K.canvas(stage, W, H), v;

    var grid = svg.appendChild(K.el('g', {}));
    for (v = XL; v <= XR; v += 1) grid.appendChild(K.el('line', { x1: px(v), y1: PT - 8, x2: px(v), y2: YB, stroke: PAL.rule, 'stroke-width': 1 }));
    [0.2, 0.4].forEach(function (u) {
      grid.appendChild(K.el('line', { x1: X0, y1: py(u), x2: X1, y2: py(u), stroke: PAL.rule, 'stroke-width': 1 }));
      grid.appendChild(K.txt(X0 - 10, py(u) + 5, String(u), { size: 15, face: 'mono', anchor: 'end' }));
    });
    grid.appendChild(K.el('line', { x1: X0, y1: YB, x2: X1, y2: YB, stroke: PAL.inkSoft, 'stroke-width': 1.6 }));
    grid.appendChild(K.el('line', { x1: X0, y1: PT - 8, x2: X0, y2: YB, stroke: PAL.inkSoft, 'stroke-width': 1.6 }));   // the y axis, as on #chisq
    for (v = XL; v <= XR; v++) grid.appendChild(K.txt(px(v), YB + 22, String(v).replace('-', '−'), { size: 15, face: 'mono', anchor: 'middle' }));

    var tails = svg.appendChild(K.el('path', { fill: PAL.brick, 'fill-opacity': 0.35 }));
    var area = svg.appendChild(K.el('path', { fill: PAL.navy, 'fill-opacity': 0.14 }));
    var norm = svg.appendChild(K.el('path', { fill: 'none', stroke: PAL.inkSoft, 'stroke-width': 2.2, 'stroke-dasharray': '7 6' }));
    var curve = svg.appendChild(K.el('path', { fill: 'none', stroke: PAL.navy, 'stroke-width': 3.2, 'stroke-linejoin': 'round' }));
    var nl = svg.appendChild(halo(K.txt(px(0.75), py(0.385), 'N(0, 1)', { size: 17, face: 'mono', fill: 'inkSoft' })));
    var cuts = svg.appendChild(K.el('g', {}));
    [-CUT, CUT].forEach(function (c) {
      cuts.appendChild(K.el('line', { x1: px(c), y1: py(0.2), x2: px(c), y2: YB, stroke: PAL.brick, 'stroke-width': 2, 'stroke-dasharray': '4 4' }));
      cuts.appendChild(halo(K.txt(px(c), py(0.2) - 8, (c < 0 ? '−' : '') + CUT, { size: 16, face: 'mono', fill: 'brick', anchor: 'middle', weight: 700 })));
    });

    // the statistic, as a stacked fraction; the denominator's σ or s in colour
    var FY = 70, F = [];
    function stat(lhs, sd, col) {
      var g = svg.appendChild(K.el('g', {})), cx = 520;
      math(g, cx - 96, FY + 12, [[lhs, 1]], 36, 'end');
      math(g, cx - 76, FY + 12, [['=']], 36);
      math(g, cx, FY - 8, [['X', 1], ['  −  '], ['μ', 1]], 32);
      g.appendChild(K.el('line', { x1: cx - 37, y1: FY - 34, x2: cx - 14, y2: FY - 34, stroke: PAL.ink, 'stroke-width': 1.6 }));   // the bar over X
      g.appendChild(K.el('line', { x1: cx - 56, y1: FY + 2, x2: cx + 56, y2: FY + 2, stroke: PAL.ink, 'stroke-width': 1.8 }));
      math(g, cx, FY + 34, [[sd, 1, col], [' / √'], ['n', 1]], 32);
      F.push(g);
    }
    stat('Z', 'σ', PAL.olive);
    stat('T', 's', PAL.orange); stat('T', 's', PAL.orange); stat('T', 's', PAL.orange);

    // readouts: k top left, the tail areas top right
    var rk = svg.appendChild(K.el('g', {})), rkv = math(rk, X0, FY + 12, [['k', 1, PAL.orange], ['  =  ']], 30, 'start').appendChild(K.el('tspan', {}));
    var rt = svg.appendChild(K.el('g', {}));
    var rtv = math(rt, X1, FY - 2, [['Beyond ±1.96:  ']], 24, 'end').appendChild(K.el('tspan', { fill: PAL.brick }));
    math(rt, X1, FY + 30, [['Normal:  5%']], 22, 'end').setAttribute('fill', PAL.inkSoft);

    // a body sentence under a note's title, justified to width w (last line ragged)
    function para(g, x, y, text, w) {
      var nodes = text.split(' ').map(function (t) { return g.appendChild(halo(K.txt(x, y, t, { size: 17 }))); });
      var wide = nodes.map(function (t) { return t.getComputedTextLength() || 8 * t.textContent.length; });
      var space = 4.5, rows = [], cur = [], used = 0;
      wide.forEach(function (v, k) {
        if (cur.length && used + space + v > w) { rows.push(cur); cur = []; used = 0; }
        used += (cur.length ? space : 0) + v; cur.push(k);
      });
      rows.push(cur);
      rows.forEach(function (ln, r) {
        var sum = ln.reduce(function (a, k) { return a + wide[k]; }, 0);
        var gap = r < rows.length - 1 && ln.length > 1 ? (w - sum) / (ln.length - 1) : space, xx = x;
        ln.forEach(function (k) { nodes[k].setAttribute('x', xx.toFixed(1)); nodes[k].setAttribute('y', y + r * 23); xx += wide[k] + gap; });
      });
    }
    function note(text, body, x, y, w) {
      var g = svg.appendChild(K.el('g', {}));
      halo(g.appendChild(K.txt(px(x), y, text, { size: 24, fill: 'ink' })));
      para(g, px(x), y + 28, body, w || X1 - px(x) - 10);
      return g;
    }
    // \u00a0 keeps each little formula on one line of the justified body
    var N = [note('Known σ: Standardise as before', 'This is the standard normal again.', -4.8, PT + 30, 270),
             note('Estimating σ by s: Fatter tails', 'Here n\u00a0=\u00a03, so there are k\u00a0=\u00a02 degrees of freedom. Since s² is a scaled χ², we get T\u00a0=\u00a0Z/√(V/k).', -4.8, PT + 30, 270),
             note('As k grows, s settles on σ', 'And t closes in on N(0,\u00a01).', -4.8, PT + 30, 270),
             note('1.96 is not enough', 'Small samples need the t\u00a0table.', 2.1, py(0.3), 250)];

    return { svg: svg, tails: tails, area: area, norm: norm, curve: curve, nl: nl, cuts: cuts,
             F: F, rk: rk, rkv: rkv, rt: rt, rtv: rtv, N: N,
             cur: XS.map(dens(Infinity)), k: Infinity, state: 0, tween: null };
  }

  function pathOf(ys) {
    return ys.map(function (y, n) { return (n ? 'L' : 'M') + px(XS[n]).toFixed(1) + ' ' + py(y).toFixed(1); }).join('');
  }
  function draw(s, i, ys) {
    s.cur = ys;
    var d = pathOf(ys);
    s.curve.setAttribute('d', d);
    s.area.setAttribute('d', d + 'L' + X1 + ' ' + YB + 'L' + X0 + ' ' + YB + 'Z');
    s.norm.setAttribute('d', i >= 1 ? pathOf(XS.map(dens(Infinity))) : '');
    // the two tails, |x| > CUT, under the current curve
    var lo = '', hi = '';
    if (i === 3) {
      XS.forEach(function (x, n) {
        if (x <= -CUT) lo += (lo ? 'L' : 'M' + px(XL) + ' ' + YB + 'L') + px(x).toFixed(1) + ' ' + py(ys[n]).toFixed(1);
        if (x >= CUT) hi += (hi ? 'L' : 'M' + px(CUT) + ' ' + YB + 'L') + px(x).toFixed(1) + ' ' + py(ys[n]).toFixed(1);
      });
      lo += 'L' + px(-CUT) + ' ' + YB + 'Z'; hi += 'L' + px(XR) + ' ' + YB + 'Z';
    }
    s.tails.setAttribute('d', lo + hi);
    s.rkv.textContent = isFinite(s.k) ? String(Math.round(s.k)) : '∞';
  }

  function stop(s) { if (s.tween) s.tween.pause(); s.tween = null; }

  function place(s, i, instant) {
    stop(s);
    s.F.forEach(function (g, n) { show(g, n === i, instant); });
    s.N.forEach(function (g, n) { show(g, n === i, instant); });
    show(s.nl, i >= 1, instant); show(s.rk, i >= 1, instant);
    show(s.cuts, i === 3, instant); show(s.rt, i === 3, instant);
    s.rtv.textContent = (100 * tail(4)).toFixed(1) + '%';
    var from = s.state; s.state = i;
    var go = !instant && !K.REDUCE && K.animeReady() && i === from + 1;
    if (!go) { s.k = KS[i]; draw(s, i, XS.map(dens(s.k))); return; }
    if (i === 2) {
      // the sweep: k climbs from 2 to 30, eased so the early, big changes get time
      s.k = 2;
      s.tween = window.anime.animate(s, { k: 30, duration: 3600, ease: 'inQuad', onUpdate: function () { draw(s, 2, XS.map(dens(s.k))); } });
      return;
    }
    var start = s.cur.slice(), target = XS.map(dens(KS[i])), t = { p: 0 };
    s.k = KS[i];
    s.tween = window.anime.animate(t, { p: 1, duration: 900, ease: 'inOutCubic',
      onUpdate: function () { draw(s, i, start.map(function (y, n) { return y + (target[n] - y) * t.p; })); } });
  }

  K.register({
    stage: 'tdist-stage',
    frags: ['tdist-frag-1', 'tdist-frag-2', 'tdist-frag-3'],
    build: build,
    place: place,
    stop: stop
  });
})();
</script>
