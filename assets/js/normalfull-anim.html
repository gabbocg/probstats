<script>
/*
  Assembling the normal density — slide #normal-full.

  The two slides before this one found e^{-x²} (the shape) and √π (its area).
  Four moves turn that into the formula in the textbook, and each move
  writes one piece of it:
    0. e^{-x²}                         area √π,    spread 1/√2
    1. e^{-x²/2}          halve the exponent: spread exactly 1, area √(2π)
    2. 1/√(2π) · …        divide by the area: area exactly 1
    3. x → x − μ          the centre slides to μ
    4. x − μ → (x − μ)/σ  σ times wider, so ÷σ to keep the area at 1

  Every curve is a · exp(-(x - mu)² / (2 s²)), and the move between states
  tweens (a, s, mu). The readouts are computed from those three numbers
  (area = a · s · √(2π)), so they are the curve's own, not labels.
  The bracket runs from mu to mu + s at the curve's height there, which is
  where the bell changes from bending down to bending up.

  Canvas 1000x445.
*/
(function () {
  var K = window.StageKit, PAL = K.PAL;

  var W = 1000, H = 445;
  var X0 = 60, X1 = 940, BASE = 410, PY = 270;   // PY px per unit of height
  var LO = -4, HI = 7;                            // the x ruler
  var MU = 1.5, SIG = 1.3;
  var R2P = Math.sqrt(2 * Math.PI);

  var STATES = [
    { a: 1,               s: Math.SQRT1_2, mu: 0,
      cap: 'the shape from two slides back: its spread is 1/√2, its area √π' },
    { a: 1,               s: 1,            mu: 0,
      cap: 'halve the exponent: the bell widens until its spread is exactly 1' },
    { a: 1 / R2P,         s: 1,            mu: 0,
      cap: 'divide by its area, √(2π), so the total probability is exactly 1' },
    { a: 1 / R2P,         s: 1,            mu: MU,
      cap: 'put x − μ where x was: the whole curve slides over to μ' },
    { a: 1 / (SIG * R2P), s: SIG,          mu: MU,
      cap: 'put (x − μ)/σ there: σ times wider, so divide by σ to keep area 1' }
  ];

  // The formula as runs: [text, superscript?, new in this state?]
  var FORMULA = [
    [['f(x) = e'], ['−x²', 1]],
    [['f(x) = e'], ['−x²', 1], ['/2', 1, 1]],
    [['f(x) = '], ['1/√(2π) · ', 0, 1], ['e'], ['−x²/2', 1]],
    [['f(x) = 1/√(2π) · e'], ['−', 1], ['(x−μ)', 1, 1], ['²/2', 1]],
    [['f(x) = 1/('], ['σ', 0, 1], ['√(2π)) · e'], ['−(x−μ)²/(2', 1], ['σ²', 1, 1], [')', 1]]
  ];
  var FSIZE = 36;

  function px(x) { return X0 + (x - LO) / (HI - LO) * (X1 - X0); }
  function py(v) { return BASE - v * PY; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function show(node, on, instant) {
    node.style.transition = instant ? 'none' : 'opacity 450ms ease';
    node.style.opacity = on ? 1 : 0;
  }

  // One text node, each run its own tspan: exponents lifted, the new piece
  // in orange so the eye goes to what this move added.
  function formula(runs) {
    var t = K.txt(80, 100, '', { size: FSIZE, face: 'mono', fill: 'ink' }), up = false;
    runs.forEach(function (r) {
      var sup = !!r[1];
      var s = K.el('tspan', {
        dy: sup === up ? null : (sup ? -0.42 * FSIZE : 0.42 * FSIZE),
        'font-size': sup ? '72%' : null,
        fill: r[2] ? PAL.orange : null,
        'font-weight': r[2] ? 700 : null
      });
      s.textContent = r[0];
      t.appendChild(s);
      up = sup;
    });
    return t;
  }

  function curve(f) {
    var d = '', i, x;
    for (i = 0; i <= 300; i++) {
      x = LO + (HI - LO) * i / 300;
      d += (i ? 'L' : 'M') + px(x).toFixed(1) + ' ' +
           py(f.a * Math.exp(-(x - f.mu) * (x - f.mu) / (2 * f.s * f.s))).toFixed(1);
    }
    return d;
  }

  function build(stage) {
    var svg = K.canvas(stage, W, H);
    var cap = svg.appendChild(K.txt(40, 30, '', { size: 'caption' }));
    var eq = svg.appendChild(formula(FORMULA[0]));

    svg.appendChild(K.el('line', { x1: X0, y1: BASE, x2: X1, y2: BASE, stroke: PAL.dim }));
    for (var x = LO; x <= HI; x++) {
      svg.appendChild(K.el('line', { x1: px(x), y1: BASE, x2: px(x), y2: BASE + 6, stroke: PAL.dim }));
      svg.appendChild(K.txt(px(x), BASE + 26, String(x).replace('-', '−'),
        { size: 'tick', face: 'mono', anchor: 'middle' }));
    }

    var fill = svg.appendChild(K.el('path', { fill: PAL.navy, 'fill-opacity': 0.12 }));
    var line = svg.appendChild(K.el('path', { fill: 'none', stroke: PAL.navy, 'stroke-width': 3 }));

    // the centre and the spread
    var muLine = svg.appendChild(K.el('line', { stroke: PAL.brick, 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    var muLab = svg.appendChild(K.txt(0, 0, 'μ', { size: 'label', face: 'mono', fill: 'brick', anchor: 'middle', weight: 700 }));
    var sdLine = svg.appendChild(K.el('line', { stroke: PAL.orange, 'stroke-width': 3, 'stroke-linecap': 'round' }));
    var sdLab = svg.appendChild(K.txt(0, 0, '', { size: 'label', face: 'mono', fill: 'orange', weight: 700 }));

    var area = svg.appendChild(K.txt(940, 170, '', { size: 'label', face: 'mono', fill: 'ink', anchor: 'end' }));

    return { svg: svg, cap: cap, eq: eq, fill: fill, line: line, muLine: muLine, muLab: muLab,
             sdLine: sdLine, sdLab: sdLab, area: area, state: 0, tween: null };
  }

  function render(s, f) {
    var d = curve(f);
    s.line.setAttribute('d', d);
    s.fill.setAttribute('d', d + 'L' + px(HI) + ' ' + BASE + 'L' + px(LO) + ' ' + BASE + 'Z');
    var top = py(f.a), hs = py(f.a * Math.exp(-0.5));
    [['x1', px(f.mu)], ['x2', px(f.mu)], ['y1', BASE], ['y2', top - 14]].forEach(function (p) {
      s.muLine.setAttribute(p[0], p[1]);
    });
    s.muLab.setAttribute('x', px(f.mu));
    s.muLab.setAttribute('y', top - 22);
    s.muLab.textContent = 'μ = ' + f.mu.toFixed(1);
    [['x1', px(f.mu)], ['x2', px(f.mu + f.s)], ['y1', hs], ['y2', hs]].forEach(function (p) {
      s.sdLine.setAttribute(p[0], p[1]);
    });
    // up and right of the bend, where the curve has already dropped away
    s.sdLab.setAttribute('x', px(f.mu + f.s) + 14);
    s.sdLab.setAttribute('y', hs - 8);
    s.sdLab.textContent = 'σ = ' + f.s.toFixed(2);
    s.area.textContent = 'area under the curve  ' + (f.a * f.s * R2P).toFixed(3);
  }

  function place(s, i, instant) {
    s.cap.textContent = STATES[i].cap;
    var eq = formula(FORMULA[i]);
    s.svg.replaceChild(eq, s.eq); s.eq = eq;
    if (!instant) { eq.style.opacity = 0; eq.getBoundingClientRect(); show(eq, true, false); }

    if (s.tween) { s.tween.pause(); s.tween = null; }
    var A = STATES[s.state], B = STATES[i];
    s.state = i;
    if (instant || K.REDUCE || !K.animeReady()) { render(s, B); return; }
    var p = { t: 0 };
    s.tween = window.anime.animate(p, {
      t: 1, duration: 1200, ease: 'inOutCubic',
      onUpdate: function () {
        render(s, { a: lerp(A.a, B.a, p.t), s: lerp(A.s, B.s, p.t), mu: lerp(A.mu, B.mu, p.t) });
      }
    });
  }

  K.register({
    stage: 'normalfull-stage',
    frags: ['normalfull-frag-1', 'normalfull-frag-2', 'normalfull-frag-3', 'normalfull-frag-4'],
    build: build,
    place: place,
    stop: function (s) { if (s.tween) s.tween.pause(); }
  });
})();
</script>
