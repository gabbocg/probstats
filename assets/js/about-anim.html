    }
    if (s.vwTween) s.vwTween.pause();
    var v = { w: s.vw };
    s.vwTween = window.anime.animate(v, {
      w: w, duration: 700, delay: delay || 0, ease: 'inOutQuart',
      onUpdate: function () {
        s.vw = v.w;
        setW(s, v.w);
      }
    });
  }

  function place(s, state, instant) {
    s.cap.textContent = CAPTIONS[state];
    var back = state < s.at;
    s.at = state;
    var target = VIEWS[state];
    var zoomed = state >= 2;
    var moving = s.view.s !== target.s;

    fade(s.pinScl, state >= 1 ? 1 : 0, instant);
    fade(s.labMan, zoomed ? 0 : 1, instant);
    // The Santiago label runs to x = 324 and the map closes at 300.
    fade(s.labScl, state === 1 || state === 2 ? 1 : 0, instant);
    // The arc has said what it has to say by the time the camera drops. Held
    // through the zoom it becomes an orange diagonal across half the country,
    // which is the one ugly frame in the sequence.
    fade(s.arc, state === 1 ? 1 : 0, instant);
    // Chile lights up as a second path fading in over the grey one. Tweening
    // the fill attribute itself means interpolating hex by hand; this is one
    // opacity and it cannot flicker.
    fade(s.chileHi, zoomed ? 1 : 0, instant, zoomed && moving ? 450 : 0);
    // The map gives up its width first, then the name fades into the gap.
    // Started together the two read as one busy move rather than "we arrive,
    // the map steps aside, the name appears".
    var wait = state >= 3 && !back ? 250 : 0;
    setWidth(s, state >= 3 ? PANEL_X - VP.x : VP.w, instant, wait);
    fade(s.nameG, state >= 3 ? 1 : 0, instant, state >= 3 ? wait + 400 : 0);

    if (s.drawn !== (state >= 1)) setArc(s, state >= 1, instant);

    if (instant || K.REDUCE || !K.animeReady()) {
      s.view.s = target.s; s.view.tx = target.tx; s.view.ty = target.ty;
      draw(s);
      return;
    }

    // A presenter who clicks twice inside 1.3s would otherwise have two
    // camera tweens writing to the same object, and the loser decides where
    // the map stops. Cancel the one in flight, start from wherever it got to.
    if (s.cam) s.cam.pause();
    if (moving || s.view.tx !== target.tx) {
      s.cam = window.anime.animate(s.view, {
        s: target.s, tx: target.tx, ty: target.ty,
        duration: 1300, ease: 'inOutQuart',
        onUpdate: function () { draw(s); }
      });
    }
  }

  function stop(s) {
    if (!s) return;
    if (s.cam) s.cam.pause();
    if (s.vwTween) s.vwTween.pause();
  }

  K.register({
    stage: 'about-stage',
    frags: ['about-frag-1', 'about-frag-2', 'about-frag-3'],
    build: build,
    place: place,
    stop: stop
  });
})();
</script>
